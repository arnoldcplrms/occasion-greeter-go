name: Birthday & Anniversary Greeter (Go)

on:
  schedule:
    - cron: '0 1 2-30/2 * *' # 9 AM PH time (UTC+8) = 1 AM UTC, even dates only
  workflow_dispatch: # Allow manual trigger

jobs:
  send-greetings:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Build
        run: go build -o bin/greeter ./cmd/greeter

      - name: Run birthday & anniversary greeter
        env:
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          CSV_URL: ${{ secrets.CSV_URL }}
          OCCASION_PHOTO_MANIFEST_URL: ${{ secrets.OCCASION_PHOTO_MANIFEST_URL }}
        run: ./bin/greeter
